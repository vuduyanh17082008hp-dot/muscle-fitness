services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: muscle-fitness-vllm
    ports:
      - "8000:8000"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-local-dev-token}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-local-dev-token}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/v1/models",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  huggingface-cache:
